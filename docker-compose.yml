version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: cp-postgres
    restart: always
    environment:
      POSTGRES_DB: cp_db
      POSTGRES_USER: cp_user
      POSTGRES_PASSWORD: cp_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cp-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: cp_user
      RABBITMQ_DEFAULT_PASS: cp_pass
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: cp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
