version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: cp-postgres
    restart: always
    environment:
      POSTGRES_DB: cp_db
      POSTGRES_USER: cp_user
      POSTGRES_PASSWORD: cp_pass
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: cp-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: cp_user
      RABBITMQ_DEFAULT_PASS: cp_pass
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: cp-redis
    ports:
      - "6379:6379"
