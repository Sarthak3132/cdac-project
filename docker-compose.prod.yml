services:
  frontend:
    image: ${DOCKER_USER}/frontend-devcompiler:${TAG:-latest}
    container_name: frontend-devcompiler
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - devcompiler-net

  backend:
    image: ${DOCKER_USER}/backend-devcompiler:${TAG:-latest}
    container_name: backend-devcompiler
    restart: unless-stopped
    ports:
      - "8080:8080" # TODO: confirm actual backend port
    env_file:
      - ./backend/.env
    networks:
      - devcompiler-net

  ai-worker:
    image: ${DOCKER_USER}/ai-worker-devcompiler:${TAG:-latest}
    container_name: ai-worker-devcompiler
    restart: unless-stopped
    env_file:
      - ./ai-worker/.env
    networks:
      - devcompiler-net

  codeRunner:
    image: ${DOCKER_USER}/coderunner-devcompiler:${TAG:-latest}
    container_name: coderunner-devcompiler
    restart: unless-stopped
    env_file:
      - ./codeRunner/.env
    networks:
      - devcompiler-net

  problemRunner:
    image: ${DOCKER_USER}/problemrunner-devcompiler:${TAG:-latest}
    container_name: problemrunner-devcompiler
    restart: unless-stopped
    env_file:
      - ./problemRunner/.env
    networks:
      - devcompiler-net

  problemSubmit:
    image: ${DOCKER_USER}/problemsubmit-devcompiler:${TAG:-latest}
    container_name: problemsubmit-devcompiler
    restart: unless-stopped
    env_file:
      - ./problemSubmit/.env
    networks:
      - devcompiler-net

networks:
  devcompiler-net:
    driver: bridge
