spring:
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    root: ERROR
    com.codeplatform.backend: INFO
