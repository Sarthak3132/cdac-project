server {
    listen 80;
    server_name devcompiler.vishalborle.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name devcompiler.vishalborle.online;

    ssl_certificate     /etc/letsencrypt/live/devcompiler.vishalborle.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devcompiler.vishalborle.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}